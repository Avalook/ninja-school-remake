<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ninja School · Bộ HD B0</title><style>body{background:#111b25;color:#e4edf1;font:15px system-ui;margin:24px}header{position:sticky;top:0;z-index:2;background:#111b25ef;padding:8px 0 16px}h1{font-size:25px}select,input{background:#203040;color:#eef;padding:9px;border:1px solid #4e7185;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#1b2b39;padding:12px;border-radius:12px}.preview{width:100%;height:260px;object-fit:contain;background:repeating-conic-gradient(#354651 0% 25%,#4b5e6a 0% 50%) 50%/20px 20px}.pending{height:260px;display:grid;place-items:center;color:#829ba9}a{color:#9cded3}h3{font-size:14px;overflow-wrap:anywhere}small{color:#b3c7d1}</style><header><h1>Bộ nhân vật và quái HD · chuẩn B0</h1><p id="status">Đang tải manifest…</p><p>Bản AI gốc ở raw/. File chuẩn hóa có alpha/kích thước phục vụ nhập game. Rig, frame mapping và hitbox do bước tích hợp kiểm tra.</p><input id="q" placeholder="Tìm mã ảnh"><select id="g"><option value="">Tất cả nhóm</option><option value="B1">B1 · Giáo viên & chó</option><option value="B2">B2 · Bạn học & biến thể</option><option value="B3">B3 · Boss</option><option value="B4">B4 · Quái & 4 tư thế</option><option value="B5">B5 · Vật liệu & đạo cụ</option></select></header><main class="grid" id="grid"></main><script>let manifest;const statusNode=document.getElementById('status');function render(){if(!manifest)return;let jobs=manifest.jobs.filter(j=>(!g.value||g.value===j.group)&&j.id.includes(q.value));statusNode.textContent=manifest.jobs.filter(j=>j.status.startsWith('generated')).length+' / '+manifest.total+' file đã sinh · tự cập nhật 10 giây';grid.replaceChildren();for(let j of jobs){let c=document.createElement('article');c.className='card';if(j.status.startsWith('generated')){let link=document.createElement('a');link.href=j.id+'.png';link.target='_blank';let im=document.createElement('img');im.className='preview';im.src=j.id+'.png';im.loading='lazy';im.alt=j.id;link.append(im);c.append(link)}else{let p=document.createElement('div');p.className='pending';p.textContent='Chờ sinh ảnh';c.append(p)}let h=document.createElement('h3');h.textContent=j.id;c.append(h);let s=document.createElement('small');s.textContent=j.group+' · '+j.kind+' · '+(j.normalization?j.normalization.size.join('×'):'chưa chuẩn hóa');c.append(s);grid.append(c)}}q.oninput=g.onchange=render;async function refresh(){try{manifest=await fetch('manifest.json?t='+Date.now()).then(r=>r.json());render()}catch(e){statusNode.textContent='Chưa đọc được manifest'}setTimeout(refresh,10000)}refresh();</script></html>
